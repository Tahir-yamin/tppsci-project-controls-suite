name: CI

on:
  # Only the default branch runs on push. Branch pushes are covered by the
  # pull_request trigger, so a branch with an open PR does not run everything
  # twice on one commit and starve itself of runners.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    # A stalled job should fail fast and legibly rather than sit until the
    # default six-hour ceiling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tppsci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name tppsci -p 8080:8080 tppsci:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Container is serving."
              docker rm -f tppsci
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy."
          docker logs tppsci
          exit 1
